<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">A Panel of Experts examining evidence</title>
<desc id="desc">A group of independent analysts works together around a table with reports, shipping routes, financial records and satellite evidence, reflecting the multidisciplinary work of United Nations sanctions experts.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef4f9"/><stop offset="1" stop-color="#e8edf5"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#142a44" flood-opacity=".15"/></filter>
</defs>
<rect width="720" height="520" rx="24" fill="url(#bg)"/>
<!-- The evidence display is deliberately an investigation rather than an evasion scene -->
<rect x="60" y="45" width="600" height="174" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="3" filter="url(#shadow)"/>
<rect x="60" y="45" width="600" height="38" rx="16" fill="#183958"/>
<rect x="60" y="70" width="600" height="13" fill="#183958"/>
