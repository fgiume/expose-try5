<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">From dispersed reports to comparable research</title>
<desc id="desc">Several reports with maps, evidence and highlighted excerpts are organised into a searchable research matrix, illustrating the EXPOSE approach.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#edf4fa"/><stop offset="1" stop-color="#f6f0eb"/></linearGradient>
 <filter id="sh" x="-25%" y="-25%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a1a33" flood-opacity=".15"/></filter>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#7997b0" opacity=".2"/></pattern>
</defs>
<rect width="720" height="520" rx="24" fill="url(#bg)"/>
<rect width="720" height="520" rx="24" fill="url(#dots)"/>
<circle cx="650" cy="68" r="114" fill="#dcebf5" opacity=".7"/>
<circle cx="55" cy="460" r="154" fill="#e6e3f2" opacity=".6"/>
